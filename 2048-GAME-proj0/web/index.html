<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <main class="stage">
    <header class="top">
      <div class="brand-block">
        <h1 class="brand">2048</h1>
        <p class="tagline">Join the tiles. Reach 2048.</p>
      </div>
      <div class="scores" aria-live="polite">
        <div class="score-card">
          <span class="score-label">Score</span>
          <span id="score" class="score-value">0</span>
        </div>
        <div class="score-card">
          <span class="score-label">Best</span>
          <span id="best" class="score-value">0</span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <button type="button" id="new-game" class="btn-primary">New Game</button>
      <p class="hint">Arrow keys or swipe</p>
    </div>

    <section class="board-wrap" aria-label="2048 board">
      <div id="board" class="board" role="grid" aria-rowcount="4" aria-colcount="4"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
        <p id="overlay-title" class="overlay-title">Game Over</p>
        <button type="button" id="try-again" class="btn-primary">Try Again</button>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
